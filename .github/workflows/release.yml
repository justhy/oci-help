name: Release

# 推送 v* 标签即自动编译、打包并发布 Release。
# 也可在 Actions 页手动触发（仅编译打包做验证，不发布 Release）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 创建 Release 需要写权限（仓库默认 token 可能为只读）
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 拉取完整历史与标签，供 Makefile 的 git describe 取版本号
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '^1.17.1'
          cache: true

      - name: Build and package
        run: make release -j$(nproc)

      - name: Show artifacts
        run: ls -lh build/

      - name: Publish release
        # 仅标签推送时发布；手动触发只做编译验证
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.zip
          generate_release_notes: true
