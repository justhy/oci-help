############################## 实例相关参数配置 ##############################
[INSTANCE]
# 虚拟云网络名称 (可选)
#vcnDisplayName=
# 子网名称 (可选)
#subnetDisplayName=
# 实例名称 (可选)
#instanceDisplayName=
# 系统 Canonical Ubuntu / CentOS / Oracle Linux
OperatingSystem=Canonical Ubuntu
# 系统版本 Canonical Ubuntu: 20.04|18.04 / CentOS :8|7 / Oracle Linux: 8|7.9
OperatingSystemVersion=20.04
# 失败后重试次数
retry=3
# 延迟时间(秒)：成功创建后，下一次创建前随机等待 minTime~maxTime
minTime=5
maxTime=30
# 失败重试等待区间(秒，可选)：留空则回退到上面的 minTime/maxTime。
# 避免抢机失败时以固定 1 秒猛打接口；连续命中限流(429)会在此基础上指数退避(上限 180 秒)。
#retryMinTime=
#retryMaxTime=
# ssh_authorized_key= # 请在下方 [INSTANCE.ARM] 和 [INSTANCE.AMD] 中配置 SSH 公钥。
# 初始化脚本（将脚本内容base64编码后添加）。该脚本将在您的实例引导或重新启动时运行。
cloud-init=

[INSTANCE.ARM]
shape=VM.Standard.A1.Flex
cpus=1 # cpu个数
memoryInGBs=6 # 内存大小(GB)
bootVolumeSizeInGBs=50 # 引导卷大小(GB)
sum=1 # 创建实例个数
retry=-1 # 失败后重试次数设置为-1，失败后一直尝试直到成功。
# 可用性域(选填)
availabilityDomain=
# SSH 公钥
ssh_authorized_key=

[INSTANCE.AMD]
shape=VM.Standard.E2.1.Micro
bootVolumeSizeInGBs=50 # 引导卷大小
sum=1 # 创建实例个数
retry=-1
# 可用性域(选填)
availabilityDomain=
# SSH 公钥
ssh_authorized_key=