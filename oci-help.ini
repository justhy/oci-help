############################## Web 管理界面配置 ##############################
# 启用方式（任选其一）:
#   1) 命令行加 -web 参数:            ./oci-help -web
#   2) 在此段设置 enabled=true
#   3) 用 -addr 指定监听地址:          ./oci-help -addr :8080
# 未配置 username/password 时，服务强制仅监听 127.0.0.1 且不校验登录。
# 若需对外提供服务，请务必配置用户名与密码（两者必须同时配置）。
[web]
enabled=false
# 监听地址: :8080 表示对外开放；127.0.0.1:8080 表示仅本机访问
addr=127.0.0.1:8080
# 访问路径（可选，默认为空）。填写后必须通过该路径访问，例如填写 /my-panel
# 则访问地址变为 http://host:8080/my-panel/ ，其他路径一律 404，
# 与用户名密码共同构成双重防护。建议使用不易猜测的字符串。
path=
# 登录用户名/密码（强烈建议配置，且必须同时填写）
username=
password=
# 启动后自动用默认浏览器打开管理界面（无桌面环境时会打印访问地址）
openBrowser=true


############################## 一键自动更新配置 ##############################
# 从该 GitHub 仓库的 Release 检查/下载新版本（owner/repo）。
# Web 界面「设置」页可检查更新并一键替换当前二进制后重启。
[update]
repo=justhy/oci-help


############################## 本地数据库说明 ##############################
# 账号配置与抢机任务都保存在本地 SQLite 数据库（默认与配置文件同目录的 oci-help.db）。
# 首次启动会把本文件中已有的账号自动导入数据库，之后以数据库为准，
# 可在 Web 界面「租户」页增删改账号。
# 可用 -db 指定数据库路径:  ./oci-help -web -db /path/to/oci-help.db


